<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IllustMine 관리자 - 일러스트 업로드 및 관리</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen py-10 px-4">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- 상단 헤더 -->
    <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
          🎨 IllustMine <span class="text-sm font-semibold bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full">Admin</span>
        </h1>
        <p class="text-sm text-gray-500 mt-1">새 일러스트를 업로드하고 기존 항목을 관리합니다.</p>
      </div>
      <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-xl transition">
        메인 서비스로 이동 ↗
      </a>
    </div>

    <!-- 1. 업로드 폼 -->
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="text-lg font-bold text-gray-900 mb-6 flex items-center gap-2">
        <span>📤</span> 새 일러스트 등록
      </h2>
      
      <form id="uploadForm" class="space-y-5">
        <!-- 제목 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">제목 *</label>
          <input type="text" id="title" required placeholder="예: 당당한 꼬마 신사" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- 카테고리 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">주제 / 카테고리 *</label>
            <select id="category" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition">
              <option value="일상/인테리어">🪴 일상/인테리어</option>
              <option value="비즈니스">💼 비즈니스</option>
              <option value="동물">🐱 동물</option>
              <option value="음식/디저트">🍰 음식/디저트</option>
            </select>
          </div>

          <!-- 계절 선택 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">계절 (선택)</label>
            <div class="flex flex-wrap gap-3 pt-2">
              <label class="inline-flex items-center text-sm cursor-pointer"><input type="checkbox" name="season" value="봄" class="rounded text-orange-500 mr-1.5">🌸 봄</label>
              <label class="inline-flex items-center text-sm cursor-pointer"><input type="checkbox" name="season" value="여름" class="rounded text-orange-500 mr-1.5">🍉 여름</label>
              <label class="inline-flex items-center text-sm cursor-pointer"><input type="checkbox" name="season" value="가을" class="rounded text-orange-500 mr-1.5">🍁 가을</label>
              <label class="inline-flex items-center text-sm cursor-pointer"><input type="checkbox" name="season" value="겨울" class="rounded text-orange-500 mr-1.5">⛄ 겨울</label>
            </div>
          </div>
        </div>

        <!-- 설명 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">상세 설명</label>
          <textarea id="description" rows="2" placeholder="일러스트에 대한 간단한 설명을 적어주세요." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition"></textarea>
        </div>

        <!-- 태그 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">태그 (쉼표로 구분)</label>
          <input type="text" id="tags" placeholder="캐릭터, 귀여운, 자신감, 일러스트" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition">
        </div>

        <!-- 이미지 파일 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">일러스트 PNG 이미지 *</label>
          <input type="file" id="imageFile" accept="image/png, image/jpeg, image/webp" required class="w-full file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100 cursor-pointer border border-gray-200 rounded-xl p-1.5">
        </div>

        <!-- 제출 버튼 -->
        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition duration-200 flex justify-center items-center gap-2">
          <span>일러스트 등록하기</span>
        </button>
      </form>
    </div>

    <!-- 2. 등록된 일러스트 목록 & 삭제 관리 -->
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
          <span>📋</span> 등록된 일러스트 관리 (<span id="itemCount">0</span>개)
        </h2>
        <button onclick="loadIllustrations()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg text-gray-600 font-medium">새로고침 🔄</button>
      </div>

      <div id="loading" class="text-center py-8 text-gray-400 text-sm">목록을 불러오는 중...</div>
      <div id="itemList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </div>

  </div>

  <script>
    // -------------------------------------------------------------
    // Supabase 클라이언트 초기화
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://mftczswnpdlrbedneare.supabase.co'.trim();
    
    // ⚠️ 아래 따옴표 안에 복사한 anon public key를 정확히 붙여넣어 주세요!
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mdGN6c3ducGRscmJlZG5lYXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNzk4MzIsImV4cCI6MjEwMjY1NTgzMn0.lEjCvgDC0l_1J310_ToTH5pHjCV8MxKOiQBfFJfx2_8'.trim();
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const uploadForm = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const itemList = document.getElementById('itemList');
    const itemCount = document.getElementById('itemCount');
    const loading = document.getElementById('loading');

    // 1. 일러스트 목록 조회
    async function loadIllustrations() {
      loading.classList.remove('hidden');
      itemList.innerHTML = '';

      const { data, error } = await supabaseClient
        .from('illustrations')
        .select('*')
        .order('id', { ascending: false });

      loading.classList.add('hidden');

      if (error) {
        alert('목록 조회 실패: ' + error.message);
        return;
      }

      itemCount.innerText = data.length;

      if (data.length === 0) {
        itemList.innerHTML = '<div class="col-span-full text-center py-8 text-gray-400 text-sm">등록된 일러스트가 없습니다.</div>';
        return;
      }

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'border border-gray-100 bg-gray-50/50 rounded-xl p-4 flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="w-full h-36 bg-white rounded-lg border border-gray-100 flex items-center justify-center p-2 mb-3 overflow-hidden">
              <img src="${item.image_url}" alt="${item.title}" class="max-h-full max-w-full object-contain">
            </div>
            <h3 class="font-bold text-gray-900 text-sm mb-1">${item.title}</h3>
            <p class="text-xs text-orange-600 font-semibold mb-1">${item.category}</p>
            <p class="text-xs text-gray-500 line-clamp-2 mb-2">${item.description || '-'}</p>
            <div class="flex flex-wrap gap-1 mb-3">
              ${(item.tags || []).map(t => `<span class="bg-gray-200/70 text-gray-600 text-[10px] px-1.5 py-0.5 rounded">#${t}</span>`).join('')}
            </div>
          </div>
          <button onclick="deleteIllustration(${item.id}, '${item.image_url}')" class="w-full py-2 bg-red-50 hover:bg-red-100 text-red-600 font-semibold text-xs rounded-lg transition border border-red-200">
            삭제하기 🗑️
          </button>
        `;
        itemList.appendChild(card);
      });
    }

    // 2. 일러스트 등록
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fileInput = document.getElementById('imageFile');
      const file = fileInput.files[0];
      if (!file) return alert('이미지 파일을 선택해 주세요.');

      submitBtn.disabled = true;
      submitBtn.innerText = '업로드 중... 잠시만 기다려주세요 ⏳';

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
        const filePath = `uploads/${fileName}`;

        // (1) Storage에 이미지 업로드
        const { error: uploadError } = await supabaseClient.storage
          .from('illustmine')
          .upload(filePath, file);

        if (uploadError) throw uploadError;

        // (2) 업로드된 이미지의 공개 URL 가져오기
        const { data: urlData } = supabaseClient.storage
          .from('illustmine')
          .getPublicUrl(filePath);

        const imageUrl = urlData.publicUrl;

        // (3) 계절 및 태그 데이터 정제
        const seasonCheckboxes = document.querySelectorAll('input[name="season"]:checked');
        const seasons = Array.from(seasonCheckboxes).map(cb => cb.value);
        const tagsInput = document.getElementById('tags').value;
        const tags = tagsInput.split(',').map(t => t.trim()).filter(t => t.length > 0);

        // (4) DB 테이블에 메타데이터 저장
        const { error: dbError } = await supabaseClient
          .from('illustrations')
          .insert([
            {
              title: document.getElementById('title').value.trim(),
              category: document.getElementById('category').value,
              season: seasons,
              image_url: imageUrl,
              description: document.getElementById('description').value.trim(),
              tags: tags
            }
          ]);

        if (dbError) throw dbError;

        alert('일러스트가 성공적으로 등록되었습니다! 🎉');
        uploadForm.reset();
        loadIllustrations();

      } catch (err) {
        console.error(err);
        alert('업로드 실패: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '일러스트 등록하기';
      }
    });

    // 3. 일러스트 삭제
    async function deleteIllustration(id, imageUrl) {
      if (!confirm('정말로 이 일러스트를 삭제하시겠습니까?')) return;

      try {
        const { error: dbError } = await supabaseClient
          .from('illustrations')
          .delete()
          .eq('id', id);

        if (dbError) throw dbError;

        const pathParts = imageUrl.split('/illustmine/');
        if (pathParts.length > 1) {
          const filePath = pathParts[1];
          await supabaseClient.storage.from('illustmine').remove([filePath]);
        }

        alert('삭제되었습니다.');
        loadIllustrations();
      } catch (err) {
        alert('삭제 실패: ' + err.message);
      }
    }

    // 페이지 진입 시 초기 목록 불러오기
    loadIllustrations();
  </script>
</body>
</html>
